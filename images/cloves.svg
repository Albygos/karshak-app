<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#EFEBE9" rx="20"/>
  <!-- Clove 1 -->
  <g transform="translate(70, 90) rotate(25)">
    <!-- Stem/shaft -->
    <path d="M-5,-35 L5,-35 L3,25 C3,30 -3,30 -3,25 Z" fill="#3E2723" stroke="#271815" stroke-width="2"/>
    <!-- Head / Sepals -->
    <path d="M-9,-35 C-7,-30 -7,-25 -10,-20 L10,-20 C7,-25 7,-30 9,-35 Z" fill="#4E342E" stroke="#271815" stroke-width="1.5"/>
    <path d="M-8,-38 L-4,-33 L0,-38 L4,-33 L8,-38" fill="none" stroke="#271815" stroke-width="2" stroke-linecap="round"/>
    <!-- Round ball head inside sepals -->
    <circle cx="0" cy="-32" r="7" fill="#8D6E63" stroke="#4E342E" stroke-width="1.5"/>
    <!-- Light reflections -->
    <circle cx="-2" cy="-34" r="2" fill="#FFF" opacity="0.4"/>
  </g>
  <!-- Clove 2 -->
  <g transform="translate(130, 110) rotate(-45)">
    <path d="M-4,-30 L4,-30 L2,20 C2,24 -2,24 -2,20 Z" fill="#2D1C18" stroke="#1B100E" stroke-width="2"/>
    <path d="M-7,-30 C-5,-26 -5,-22 -8,-18 L8,-18 C5,-22 5,-26 7,-30 Z" fill="#3E2723" stroke="#1B100E" stroke-width="1.5"/>
    <circle cx="0" cy="-28" r="6" fill="#795548" stroke="#3E2723" stroke-width="1.5"/>
  </g>
  <!-- Clove 3 (lying flat in foreground) -->
  <g transform="translate(90, 130) rotate(80)">
    <path d="M-4,-25 L4,-25 L2,15 C2,18 -2,18 -2,15 Z" fill="#4E342E" stroke="#2D1C18" stroke-width="1.5"/>
    <circle cx="0" cy="-23" r="5.5" fill="#A1887F" stroke="#4E342E" stroke-width="1.2"/>
  </g>
</svg>
