<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#FBE9E7" rx="20"/>
  <!-- Cinnamon Stick 1 (behind) -->
  <g transform="translate(90, 80) rotate(-40)">
    <rect x="-10" y="-50" width="20" height="100" rx="3" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
    <!-- Scroll inner line -->
    <line x1="-5" y1="-50" x2="-5" y2="50" stroke="#5D4037" stroke-width="1.5"/>
    <path d="M-10,-50 C-10,-55 10,-55 10,-50 C10,-45 -10,-45 -10,-50 Z" fill="#5D4037"/>
  </g>
  <!-- Cinnamon Stick 2 (main foreground) -->
  <g transform="translate(100, 110) rotate(35)">
    <!-- Tube Body -->
    <rect x="-14" y="-60" width="28" height="120" rx="4" fill="#A1887F" stroke="#6D4C41" stroke-width="2"/>
    <!-- Scroll curves to show rolled bark quills -->
    <line x1="-8" y1="-60" x2="-8" y2="60" stroke="#6D4C41" stroke-width="1.5"/>
    <line x1="6" y1="-60" x2="6" y2="60" stroke="#6D4C41" stroke-width="1.5"/>
    <!-- End roll caps -->
    <path d="M-14,-60 C-14,-66 14,-66 14,-60 C14,-54 -14,-54 -14,-60 Z" fill="#6D4C41"/>
    <!-- Quill inner spiral drawing at cut ends -->
    <path d="M-14,-60 C-14,-63 -4,-63 -4,-60 C-4,-57 -10,-57 -10,-60" fill="none" stroke="#3E2723" stroke-width="1.5"/>
    <path d="M14,-60 C14,-63 4,-63 4,-60 C4,-57 10,-57 10,-60" fill="none" stroke="#3E2723" stroke-width="1.5"/>
    
    <path d="M-14,60 C-14,63 -4,63 -4,60" fill="none" stroke="#3E2723" stroke-width="1.5"/>
    <!-- Bark texture wood lines -->
    <line x1="-3" y1="-30" x2="-3" y2="10" stroke="#5D4037" stroke-width="1" stroke-dasharray="8 4"/>
    <line x1="2" y1="-10" x2="2" y2="40" stroke="#5D4037" stroke-width="1" stroke-dasharray="10 6"/>
  </g>
</svg>
