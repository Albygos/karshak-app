<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#F4ECE1" rx="20"/>
  <!-- Wooden Spoon Handle -->
  <path d="M10,140 C20,135 60,110 90,95 L110,115 C95,125 50,150 25,160 Z" fill="#D7CCC8" stroke="#B0BEC5" stroke-width="0.5"/>
  <!-- Wooden Spoon Bowl -->
  <circle cx="120" cy="90" r="30" fill="#D7CCC8" stroke="#A1887F" stroke-width="2"/>
  <circle cx="120" cy="90" r="26" fill="#C7B299"/>
  <!-- Black Peppercorns inside spoon and falling out -->
  <circle cx="108" cy="85" r="7" fill="#2E1C0C"/>
  <circle cx="120" cy="74" r="6" fill="#1C1007"/>
  <circle cx="132" cy="82" r="6.5" fill="#3D2A18"/>
  <circle cx="114" cy="98" r="7.5" fill="#1C1007"/>
  <circle cx="128" cy="96" r="6" fill="#2E1C0C"/>
  <circle cx="122" cy="87" r="8" fill="#1A0D02"/>
  
  <!-- Overlay layer of peppercorns to form a pile -->
  <circle cx="112" cy="78" r="6" fill="#3E2723"/>
  <circle cx="124" cy="82" r="7" fill="#212121"/>
  <circle cx="118" cy="90" r="6.5" fill="#3E2723"/>
  <circle cx="130" cy="88" r="7" fill="#2E1C0C"/>
  
  <!-- Scattered peppercorns around spoon -->
  <circle cx="85" cy="75" r="5" fill="#212121"/>
  <circle cx="145" cy="115" r="5.5" fill="#3E2723"/>
  <circle cx="155" cy="85" r="6" fill="#212121"/>
  <circle cx="75" cy="100" r="5" fill="#2E1C0C"/>
  <circle cx="95" cy="110" r="6.5" fill="#1C1007"/>

  <!-- Texture marks on peppercorns -->
  <path d="M122,80 A 2 2 0 0 1 126,82" stroke="#757575" stroke-width="1" fill="none"/>
  <path d="M110,88 A 2 2 0 0 1 114,90" stroke="#757575" stroke-width="1" fill="none"/>
  <path d="M128,94 A 2 2 0 0 1 132,96" stroke="#757575" stroke-width="1" fill="none"/>
</svg>
