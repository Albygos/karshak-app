<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#FFF8E1" rx="20"/>
  <!-- Turmeric Root -->
  <g transform="translate(60, 110) rotate(-15)">
    <!-- Root body -->
    <path d="M-35,-15 C-15,-20 15,-15 35,-5 C45,0 45,15 30,20 C10,25 -20,20 -35,10 C-45,5 -45,-10 -35,-15 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
    <!-- Ring segments of ginger-like root -->
    <path d="M-20,-17 C-15,-10 -15,10 -20,17" fill="none" stroke="#5D4037" stroke-width="1.5"/>
    <path d="M-5,-16 C0,-10 0,10 -5,20" fill="none" stroke="#5D4037" stroke-width="1.5"/>
    <path d="M10,-14 C15,-8 15,10 10,20" fill="none" stroke="#5D4037" stroke-width="1.5"/>
    <path d="M25,-9 C30,-4 30,8 25,18" fill="none" stroke="#5D4037" stroke-width="1.5"/>
    <!-- Small knot branching off -->
    <path d="M-10,18 C-5,25 5,35 15,30 C22,25 15,15 10,12" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
    <path d="M0,23 C2,26 8,28 10,24" fill="none" stroke="#5D4037" stroke-width="1"/>
    <!-- Cut end showing orange interior -->
    <path d="M-35,-15 C-38,-10 -38,5 -35,10 C-32,5 -32,-10 -35,-15 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
  </g>
  <!-- Turmeric Powder Pile -->
  <g transform="translate(130, 110)">
    <!-- Powder base shape -->
    <path d="M-45,25 C-30,-10 30,-10 45,25 Z" fill="#FFC107"/>
    <!-- Top inner orange-yellow highlights for texture -->
    <path d="M-35,25 C-20,0 20,0 35,25 Z" fill="#FFB300"/>
    <path d="M-20,25 C-10,10 10,10 20,25 Z" fill="#FF8F00"/>
    <!-- Tiny grains effect -->
    <circle cx="-15" cy="22" r="1.5" fill="#FFD54F"/>
    <circle cx="15" cy="18" r="1" fill="#FFD54F"/>
    <circle cx="0" cy="14" r="1.2" fill="#FFF9C4"/>
    <circle cx="28" cy="24" r="1" fill="#FFD54F"/>
    <circle cx="-32" cy="24" r="1.2" fill="#FFD54F"/>
  </g>
</svg>
