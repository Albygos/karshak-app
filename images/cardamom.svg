<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#EAF4EC" rx="20"/>
  <!-- Cardamom Pod 1 -->
  <g transform="translate(60, 100) rotate(-30)">
    <path d="M-20,0 C-20,-45 20,-45 20,0 C20,45 -20,45 -20,0 Z" fill="#88B04B" stroke="#688F31" stroke-width="3"/>
    <!-- Ribs/Lines on pod -->
    <path d="M-10,-35 C0,-20 0,20 -10,35" fill="none" stroke="#688F31" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M0,-40 C10,-20 10,20 0,40" fill="none" stroke="#688F31" stroke-width="2"/>
    <path d="M10,-35 C20,-20 20,20 10,35" fill="none" stroke="#688F31" stroke-width="1.5" stroke-dasharray="2 2"/>
    <!-- Stem/Tip -->
    <path d="M0,-40 L0,-46" stroke="#4E7020" stroke-width="3" stroke-linecap="round"/>
    <path d="M0,40 L0,44" stroke="#4E7020" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Cardamom Pod 2 -->
  <g transform="translate(130, 80) rotate(45)">
    <path d="M-18,0 C-18,-40 18,-40 18,0 C18,40 -18,40 -18,0 Z" fill="#9CC063" stroke="#7AA243" stroke-width="3"/>
    <path d="M0,-40 C5,-15 5,15 0,40" fill="none" stroke="#7AA243" stroke-width="2"/>
    <path d="M-8,-32 C0,-15 0,15 -8,32" fill="none" stroke="#7AA243" stroke-width="1.5"/>
    <path d="M0,-40 L0,-45" stroke="#5C7F2F" stroke-width="2.5"/>
  </g>
  <!-- Pod 3 (open showing seeds) -->
  <g transform="translate(110, 130) rotate(-110)">
    <!-- Back shell -->
    <path d="M-15,0 C-15,-35 15,-35 15,0 C15,35 -15,35 -15,0 Z" fill="#A8C878" stroke="#8BB055" stroke-width="2"/>
    <!-- Cracked open look -->
    <path d="M-10,-20 C-5,-5 -5,5 -10,20 L10,20 C5,5 5,-5 10,-20 Z" fill="#F4F8EE" stroke="#8BB055" stroke-width="1"/>
    <!-- Black seeds inside -->
    <circle cx="-2" cy="-10" r="4" fill="#3E2723"/>
    <circle cx="3" cy="-5" r="3.5" fill="#2D1D1A"/>
    <circle cx="-4" cy="2" r="4" fill="#3E2723"/>
    <circle cx="2" cy="8" r="4.5" fill="#2D1D1A"/>
    <circle cx="-1" cy="14" r="3.5" fill="#3E2723"/>
  </g>
</svg>
