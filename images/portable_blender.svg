<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <rect width="150" height="150" fill="#A8E6CF" rx="15"/>
  <!-- Blender Body -->
  <!-- Jar -->
  <rect x="55" y="25" width="40" height="65" rx="8" fill="rgba(255,255,255,0.4)" stroke="#81C784" stroke-width="2"/>
  <rect x="58" y="28" width="34" height="59" rx="6" fill="rgba(200,230,201,0.6)"/>
  <!-- Lid -->
  <rect x="52" y="18" width="46" height="8" rx="2" fill="#37474F"/>
  <rect x="67" y="14" width="16" height="4" rx="1" fill="#455A64"/>
  <!-- Base -->
  <rect x="52" y="89" width="46" height="36" rx="4" fill="#37474F"/>
  <!-- Blender details / silver bands -->
  <rect x="52" y="94" width="46" height="4" fill="#78909C"/>
  <circle cx="75" cy="107" r="5" fill="#CFD8DC"/>
  <circle cx="75" cy="107" r="3" fill="#00E676"/>
  <!-- Measurements -->
  <line x1="90" y1="35" x2="93" y2="35" stroke="#81C784" stroke-width="1.5"/>
  <line x1="90" y1="45" x2="93" y2="45" stroke="#81C784" stroke-width="1.5"/>
  <line x1="90" y1="55" x2="93" y2="55" stroke="#81C784" stroke-width="1.5"/>
  <line x1="90" y1="65" x2="93" y2="65" stroke="#81C784" stroke-width="1.5"/>
  <!-- Fruits inside -->
  <!-- Strawberry -->
  <path d="M64,65 Q60,70 65,75 Q70,75 72,70 Q70,63 64,65 Z" fill="#E53935"/>
  <!-- Strawberry leaves -->
  <path d="M63,65 Q65,62 67,65 Z" fill="#4CAF50"/>
  <!-- Orange slice -->
  <circle cx="83" cy="50" r="8" fill="#FFB74D"/>
  <circle cx="83" cy="50" r="6" fill="#FFA726"/>
  <!-- Banana slice -->
  <circle cx="68" cy="42" r="5" fill="#FFF59D"/>
  <circle cx="68" cy="42" r="3" fill="#FFF176"/>
  <!-- Blueberries -->
  <circle cx="74" cy="68" r="3" fill="#3F51B5"/>
  <circle cx="78" cy="72" r="3.5" fill="#3F51B5"/>
  <!-- Liquid / smoothie background -->
  <path d="M 58 75 Q 75 73 92 75 L 92 85 Q 75 87 58 85 Z" fill="#E57373" opacity="0.8"/>
