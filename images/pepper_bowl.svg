<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FBF9F6" rx="20"/>
  <!-- Background cloth/linen -->
  <path d="M50,220 L350,220 L320,280 L80,280 Z" fill="#EFEBE9" opacity="0.6"/>
  <!-- Leaves -->
  <g transform="translate(110, 205) rotate(-20)">
    <path d="M0,0 C20,-20 50,-10 60,10 C40,20 10,10 0,0 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5"/>
    <path d="M0,0 Q30,-5 60,10" fill="none" stroke="#1B5E20" stroke-width="1"/>
  </g>
  <!-- Wooden Bowl -->
  <ellipse cx="200" cy="170" rx="110" ry="70" fill="#8D6E63" stroke="#5D4037" stroke-width="6"/>
  <ellipse cx="200" cy="160" rx="98" ry="54" fill="#5D4037"/>
  <ellipse cx="200" cy="154" rx="94" ry="46" fill="#3E2723"/>
  <!-- Peppercorns pile inside bowl -->
  <g fill="#212121" stroke="#111" stroke-width="0.5">
    <circle cx="150" cy="140" r="10"/>
    <circle cx="170" cy="130" r="9"/>
    <circle cx="190" cy="125" r="11"/>
    <circle cx="210" cy="132" r="9.5"/>
    <circle cx="230" cy="138" r="10.5"/>
    
    <circle cx="140" cy="155" r="10"/>
    <circle cx="160" cy="150" r="11"/>
    <circle cx="180" cy="142" r="9.5"/>
    <circle cx="200" cy="138" r="11"/>
    <circle cx="220" cy="145" r="10"/>
    <circle cx="240" cy="150" r="9.5"/>
    <circle cx="260" cy="158" r="9"/>
    
    <circle cx="130" cy="170" r="9"/>
    <circle cx="150" cy="165" r="10.5"/>
    <circle cx="170" cy="160" r="10"/>
    <circle cx="190" cy="154" r="11.5"/>
    <circle cx="210" cy="156" r="10"/>
    <circle cx="230" cy="162" r="11"/>
    <circle cx="250" cy="168" r="10"/>
    <circle cx="270" cy="174" r="8"/>
    
    <!-- Top pile layer -->
    <circle cx="175" cy="130" r="10" fill="#321D11"/>
    <circle cx="195" cy="120" r="10.5" fill="#1A0D02"/>
    <circle cx="215" cy="126" r="9.5" fill="#2E1C0C"/>
    <circle cx="185" cy="142" r="11" fill="#1C1007"/>
    <circle cx="205" cy="135" r="10" fill="#2E1C0C"/>
    
    <!-- Highlights -->
